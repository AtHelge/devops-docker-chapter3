services:
  frontend:
    image: athelge/example-frontend:v2
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:8080

  backend:
    image: athelge/example-backend:v1
    environment:
      - REQUEST_ORIGIN=http://localhost:8000
      - REDIS_HOST=redis
      - POSTGRES_HOST=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DATABASE=postgres
    depends_on:
      - redis
      - db
  redis:
    image: redis
  
  db:
    image: postgres:18
    environment:
      - POSTGRES_PASSWORD=postgres
    restart: unless-stopped
    volumes:
      - ./database:/var/lib/postgresql

  nginx:
    image: nginx
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend

