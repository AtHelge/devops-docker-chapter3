services:
  frontend:
    image: athelge/example-frontend:v1
    ports:
      - "5001:5001"
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:8080

  backend:
    image: athelge/example-backend:v1
    ports:
      - "8080:8080"
    environment:
      - REQUEST_ORIGIN=http://localhost:5001
      - REDIS_HOST=redis
      - POSTGRES_HOST=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DATABASE=postgres
    depends_on:
      - redis
      - db
  redis:
    image: redis
  
  db:
    image: postgres:18
    environment:
      - POSTGRES_PASSWORD=postgres
    restart: unless-stopped

